<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi San Valentín</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="hearts">
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
        </div>
        
        <div class="content">
            <h1 class="title">¿Quieres ser mi San Valentín?</h1>
            
            <div class="video-container">
                <!-- Aquí puedes insertar tu video -->
                <div class="video-placeholder">
                    <p><video autoplay muted loop controls style="width: 100%; height: auto; object-fit: contain;">
                        <source src="videosanvalentin.mp4" type="video/mp4">
                        
                    </video></p>
                </div>
            </div>

            <div class="answer">
                <h2>Sí ❤️</h2>
                <div class="message">
                    <p class="love-quote">Porque contigo los segundos se vuelven eternidad,</p>
                    <p class="love-quote">cada momento a tu lado es mi felicidad.</p>
                    <p class="love-quote">Eres mi historia perfecta, mi mejor casualidad,</p>
                    <p class="love-quote">el amor que siempre soñé encontrar.</p>
                </div>
            </div>

            <div class="music-section">
                <div class="guitar-decoration">
                    <i class="fas fa-guitar"></i>
                </div>
                <h3>Nuestra Canción</h3>
                <div class="music-player">
                    <div class="vinyl-record">
                        <div class="vinyl-center"></div>
                    </div>
                    <div class="music-placeholder">
                        <p><i class="fas fa-music"></i> <audio id="miAudio" autoplay="2" controls>
                            <source src="audiosanvalentin.mp3" type="audio/mp3">
                        </audio>
                        
                        
                        </p>
                    </div>
                </div>
                <div class="music-notes">
                    <i class="fas fa-music note-1"></i>
                    <i class="fas fa-music note-2"></i>
                    <i class="fas fa-music note-3"></i>
                </div>
            </div>
        </div>

        <div class="floating-hearts">
            <div class="float-heart"></div>
            <div class="float-heart"></div>
            <div class="float-heart"></div>
            <div class="float-heart"></div>
            <div class="float-heart"></div>
        </div>
    </div>
</body>
</html>
